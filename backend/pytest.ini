# backend/pytest.ini
[pytest]
DJANGO_SETTINGS_MODULE = core.settings
pythonpath = backend
# Solo test_*.py dentro de estas carpetas:
testpaths =
    backend/tests
    core
    shop
    jwtcheck
python_files = test_*.py
addopts = -v --disable-warnings --cov=shop --cov-report=term-missing
norecursedirs = .venv env build dist migrations manual_tests
