name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django/DRF)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || true
          pip install -r requirements-dev.txt || true

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-precommit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Lint (ruff)
        run: ruff check . || true

      - name: Format check (black)
        run: black --check . || true

      - name: Run tests (pytest)
        env:
          DJANGO_SETTINGS_MODULE: core.settings
          USE_SQLITE_FOR_TESTS: "1"
        run: pytest -v --maxfail=1 --disable-warnings

      - name: pip-audit (non-blocking)
        continue-on-error: true
        run: pip-audit

      - name: bandit (non-blocking)
        continue-on-error: true
        run: bandit -r .

  healthcheck:
    name: Backend Health Check (Smoke Test)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || true

      - name: Run migrations and start Django server
        run: |
          python manage.py migrate --noinput
          nohup python manage.py runserver 0.0.0.0:8000 &
          sleep 5

      - name: Verify /api/health/ endpoint
        run: |
          echo "🩺 Checking backend health..."
          curl -fsS http://127.0.0.1:8000/api/health/ | tee /tmp/health_response.json
          echo "✅ Backend responded OK"

  frontend:
    name: Frontend (Astro)
    runs-on: ubuntu-latest
    needs: [backend, healthcheck]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || true

      - name: Build project
        run: npm run build || true
